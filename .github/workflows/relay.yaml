name: Relay

on:
  push:
    branches:
      - "master"
    paths:
      - "worker/**"
      - "docs/SHARE_PROTOCOL.md"
      - ".github/workflows/relay.yaml"
  pull_request:
    paths:
      - "worker/**"
      - "docs/SHARE_PROTOCOL.md"
      - ".github/workflows/relay.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Test Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Catches bundling and module-shape errors that tests cannot.
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy Worker
    needs: test
    # Pushes to master only. Pull requests (including forks) never see the secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: relay-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
