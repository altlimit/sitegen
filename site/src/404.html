---
title: Page not found
path: 404.html
template: main.html
sitemap: false
---

{{define "content"}}
<div class="not-found">
    <p class="not-found-code">404</p>
    <h1>This page doesn't exist</h1>
    <p class="lead">The link may be old, or the page may have moved.</p>
    <div class="actions">
        <a class="btn btn-primary" href="{{path "/"}}">Go home</a>
        <a class="btn btn-ghost" href="{{path "/docs"}}">Browse the docs</a>
    </div>
</div>
{{end}}
